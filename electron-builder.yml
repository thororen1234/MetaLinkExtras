appId: com.metalinkextras.app
productName: MetaLinkExtras
copyright: "Copyright © 2026"

directories:
  output: dist

publish: never

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"
  - from: assets/icon.png
    to: icon.png

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
